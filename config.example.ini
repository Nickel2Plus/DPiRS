# DPiRS configuration / 設定ファイル
# Copy to config.ini and edit with nano or vi.  (install.sh does this for you)
# config.ini にコピーして nano や vi で編集します（install.sh が自動で行います）。

[general]
# Message language: auto, ja or en  /  メッセージの言語: auto, ja, en
language = auto

[station]
# Your own callsign + SSID used to log in to APRS-IS (an i-Gate needs a licensed callsign).
# Example: JA1ABC-10.   SSID -1 .. -15 or none.
# APRS-ISにログインする自局のコールサイン＋SSID（例: JA1ABC-10）
callsign = NOCALL-10

[modem]
# GPIO (hat) type modem: /dev/serial0     USB modem: /dev/ttyACM0
serial_port = /dev/serial0
baudrate = 115200
# Receive frequency in Hz  /  受信周波数（Hz）
rx_frequency = 438010000
# Correction in Hz if your board is off frequency (normally 0)
# ボードの周波数ずれを補正する場合のHz（通常は0）
frequency_offset = 0
# Set to yes only if nothing is received with "no"  /  受信できない場合のみ yes
rx_invert = no

[aprs_is]
# yes: forward to APRS-IS (positions become PUBLIC, e.g. on aprs.fi).
# no : dry run, only print what would be sent.
# yes: APRS-ISへ送出（位置が aprs.fi などで公開されます） / no: ドライラン（表示のみ）
send = no
server = asia.aprs2.net
server_port = 14580
# Leave empty to compute it from the callsign automatically  /  空欄なら自動計算
passcode =

[filter]
# Same packet from the same station within this many seconds is dropped
# 同じ局の同じ内容のパケットを、この秒数以内は破棄
dupe_seconds = 30
# Minimum seconds between different packets from the same station (rate limit)
# 同じ局からの異なるパケットの最小間隔（秒）
min_interval = 10

[beacon]
# Announce this i-Gate itself on APRS-IS (optional).  Decimal degrees, S/W are negative. NOTE: the coordinates become PUBLIC on the map.
# このi-Gate自身の位置をAPRS-ISに送る（任意）。十進の度、南緯・西経は負。※座標は地図上で【公開】されます
enabled = no
latitude = 0.0
longitude = 0.0
comment = D-STAR DPRS RX-only iGate
# 10 or more  /  10以上
interval_minutes = 30
